<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8bbd0">
<title>С Днём Рождения 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Playfair Display', Georgia, serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
  }

  /* Фон: плывущие сердечки */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bg-heart {
    position: absolute; font-size: 22px; opacity: 0.4;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh) rotate(0); opacity: 0; }
    10%, 90% { opacity: 0.5; }
    to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }

  /* ГЛАВНАЯ СТРАНИЦА (ОБЛОЖКА) */
  .cover {
    position: fixed; inset: 0; z-index: 10000;
    background: linear-gradient(135deg, #f8bbd0 0%, #f48fb1 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 1s ease, visibility 1s ease;
    cursor: pointer;
  }
  .cover.hidden { opacity: 0; visibility: hidden; }
  .cover-card {
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 40px; border-radius: 20px;
    box-shadow: 0 20px 50px rgba(180, 80, 120, 0.3);
    text-align: center; transform: translateY(0);
    transition: transform 0.3s ease; max-width: 90vw;
  }
  .cover:hover .cover-card { transform: translateY(-5px); }
  .cover-title { font-family: 'Great Vibes', cursive; font-size: 3.5em; color: #c94b6b; margin-bottom: 10px; line-height: 1.2; }
  .cover-subtitle { font-size: 1.1em; color: #8a5a68; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px; }
  .cover-btn {
    font-family: 'Playfair Display', Georgia, serif; font-size: 1.2em; color: #fff;
    background: #c94b6b; padding: 15px 40px; border-radius: 30px; border: none;
    cursor: pointer; box-shadow: 0 8px 20px rgba(201, 75, 107, 0.4);
    animation: pulseBtn 2s infinite; display: inline-block;
  }
  @keyframes pulseBtn {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(201, 75, 107, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(201, 75, 107, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(201, 75, 107, 0); }
  }

  /* Кнопка музыки */
  .music-btn {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(5px);
    color: #c94b6b; font-size: 20px; cursor: pointer; 
    box-shadow: 0 4px 15px rgba(201, 75, 107, 0.2);
    transition: all 0.3s; display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
  }
  .music-btn.show { opacity: 1; pointer-events: auto; }
  .music-btn:hover { background: #fff; transform: scale(1.1); }
  .music-btn.playing { animation: spin 4s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Расположение книги */
  .book-wrapper {
    width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    perspective: 2800px;
  }
  
  .book {
    width: min(780px, 72vw); 
    height: min(550px, 80vh);
    position: relative; transform-style: preserve-3d;
  }

  /* Страница */
  .page {
    position: absolute; inset: 0; transform-origin: left center;
    transform-style: preserve-3d; transform: translateZ(0); 
    transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
    will-change: transform;
  }
  .page-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .page-front {
    border-radius: 0 18px 18px 0; border: 1px solid rgba(201, 75, 107, 0.1);
    background:
      radial-gradient(circle at 100% 0%, rgba(255,220,230,0.6) 0%, transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(255,200,220,0.4) 0%, transparent 55%),
      linear-gradient(135deg, #fff9fb 0%, #fff5f8 100%);
    display: flex; padding: 25px; gap: 20px;
  }
  .page-back {
    transform: rotateY(180deg); border-radius: 18px 0 0 18px;
    border: 1px solid rgba(201, 75, 107, 0.1);
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
    display: flex; justify-content: center; align-items: center;
  }
  .page-back::after { content: '💗'; font-size: 64px; opacity: 0.55; }

  /* Блок с фото / видео */
  .photo-side { flex: 0 0 42%; display: flex; justify-content: center; align-items: center; }
  
  .photo-frame {
    position: relative; 
    width: 100%; 
    max-width: 260px; 
    height: 100%; 
    max-height: 370px; 
    aspect-ratio: 3 / 4; 
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
    padding: 10px; box-shadow: 0 8px 25px rgba(180, 80, 120, 0.25);
    border-radius: 4px; opacity: 0; transform: rotate(-2deg) translateY(20px) scale(0.92);
    transition: opacity 0.9s 0.3s ease, transform 0.9s 0.3s ease;
    overflow: hidden; 
  }
  
  /* Картинки */
  .photo-frame img { 
    width: 100%; height: 100%; object-fit: cover; border-radius: 2px; display: block; 
  }

  /* ВИДЕО: заполняет всю рамку, без черных краев */
  .photo-frame video { 
    width: 100%; height: 100%; 
    object-fit: cover; 
    background: transparent;
    border-radius: 2px; display: block; 
  }
  
  .page.active .photo-frame { opacity: 1; transform: rotate(-2deg) translateY(0) scale(1); }

  /* Блок с текстом */
  .text-side { 
    flex: 1; display: flex; flex-direction: column; justify-content: center; 
    padding-left: 10px;
    padding-right: 15px; 
    min-width: 0; 
    overflow-wrap: break-word; 
    word-wrap: break-word;
  }
  .page-num { font-family: 'Great Vibes', cursive; color: #d68aa8; font-size: 1.2em; margin-bottom: 6px; opacity: 0; transform: translateY(18px); transition: opacity 0.8s 0.35s ease, transform 0.8s 0.35s ease; }
  .page-title { font-family: 'Great Vibes', cursive; color: #c94b6b; font-size: clamp(1.5em, 2.5vw, 2.1em); line-height: 1.15; margin-bottom: 15px; opacity: 0; transform: translateY(18px); transition: opacity 0.8s 0.5s ease, transform 0.8s 0.5s ease; }
  .page-wish { font-size: clamp(0.85em, 1.1vw, 0.95em); line-height: 1.7; color: #5a3a42; font-style: italic; opacity: 0; transform: translateY(18px); transition: opacity 0.8s 0.65s ease, transform 0.8s 0.65s ease; }
  .page.active .page-num, .page.active .page-title, .page.active .page-wish { opacity: 1; transform: translateY(0); }

  /* Кнопки навигации */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.92); color: #c94b6b; font-size: 26px; font-family: Georgia, serif;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 6px 22px rgba(180, 80, 120, 0.32); transition: all 0.25s; z-index: 1000;
  }
  .nav-btn:hover:not(:disabled) { background: #c94b6b; color: #fff; transform: translateY(-50%) scale(1.1); }
  .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }
  
  .nav-prev { left: calc(50% - min(390px, 36vw) - 70px); }
  .nav-next { right: calc(50% - min(390px, 36vw) - 70px); }

  /* Прогресс-точки */
  .progress { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; max-width: 90vw; flex-wrap: wrap; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(201, 75, 107, 0.32); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: #c94b6b; transform: scale(1.4); }

  /* Мобильная версия */
  @media (max-width: 800px) {
    .cover-title { font-size: 2.8em; }
    .cover-subtitle { font-size: 0.9em; }
    .cover-card { padding: 40px 20px; }
    .book { width: 92vw; height: 82vh; }
    .page-front { flex-direction: column; padding: 20px; gap: 15px; align-items: center; }
    .photo-side { flex: 0 0 auto; }
    .photo-frame { max-width: 160px; max-height: 220px; padding: 8px; }
    .text-side { padding: 0; text-align: center; }
    .page-title { font-size: 1.8em; margin-bottom: 10px; }
    .page-wish { font-size: 0.85em; line-height: 1.6; }
    
    .nav-prev { left: 10px; } 
    .nav-next { right: 10px; }
    .nav-btn { width: 44px; height: 44px; font-size: 20px; }
    
    .dot { width: 8px; height: 8px; }
    .progress { bottom: 14px; gap: 6px; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<!-- ОБЛОЖКА -->
<div class="cover" id="cover">
  <div class="cover-card">
    <div class="cover-title">Для тебя</div>
    <div class="cover-subtitle">С Днём Рождения</div>
    <div class="cover-btn">✨ Открой меня ✨</div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="lilpeep.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" class="music-btn" title="Включить/выключить музыку">🎵</button>

<div class="book-wrapper">
  <div class="book" id="book"></div>
  <button class="nav-btn nav-prev" id="prevBtn" aria-label="Назад">‹</button>
  <button class="nav-btn nav-next" id="nextBtn" aria-label="Вперёд">›</button>
</div>

<div class="progress" id="progress"></div>

<script>
/* ============================================================
   ✏️  ТЕКСТЫ И ФОТО (ваши правки)
   ============================================================ */
const pagesData = [
  { photo: '1.png',  chapter: 'Глава 1',    title: 'С Днём Рождения!🎁',
    wish: 'С самой первой страницы нашей истории я понял, что в моей жизни появился кто-то совершенно особенный. Ты перевернула мой мир и наполнила его совершенно другими красками, о существовании которых я даже не догадывался.' },
  { photo: '2.png',  chapter: 'Глава 2',   title: 'Твоя улыбка 🙂',
    wish: 'Твоя улыбка — это лучшее, что я вижу каждый день. Она способна мгновенно осветить даже самый хмурый и тяжелый момент, подарить уверенность и заставить забыть обо всех проблемах.' },
  { photo: '3.png',  chapter: 'Глава 3',  title: 'Твои глаза 👀',
    wish: 'В твоих глазах можно утонуть — такие они глубокие и тёплые. Желаю тебе видеть вокруг только хорошее, а в отражении — людей, которые тебя искренне любят.' },
  { photo: '4.png',  chapter: 'Глава 4',   title: 'Твоя доброта ☺️',
    wish: 'В тебе столько искреннего тепла и заботы, что этого хватит, чтобы согреть весь мир. Твоя доброта делает людей вокруг лучше, а меня — самым счастливым человеком на земле.' },
  { photo: '5.png',  chapter: 'Глава 5',    title: 'Твой смех 😸',
    wish: 'Твой смех — это любимый звук на свете. Когда ты искренне смеешься, улыбается всё внутри меня, и в этот момент кажется, что абсолютно любые проблемы теряют всякий смысл.' },
  { photo: '6.png',  chapter: 'Глава 6',   title: 'Мечты 🤤',
    wish: 'Загадай самое заветное желание — и оно обязательно сбудется. Ты заслуживаешь всего самого лучшего, что есть в этом мире. Пусть мечты превращаются в планы, а планы — в счастливые воспоминания.' },
  { photo: '7.png',  chapter: 'Глава 7',  title: 'Приключения 💫',
    wish: 'Пусть этот год будет полон спонтанных поездок, новых мест и незабываемых моментов. И пусть рядом всегда будет кто-то, с кем не страшно свернуть с маршрута.' },
  { photo: '8.png',  chapter: 'Глава 8', title: 'Здоровье 💗',
    wish: 'Береги себя, моя родная. Я хочу, чтобы ты всегда чувствовала себя бодрой, полной сил и энергии, а я сделаю всё, чтобы оградить тебя от любых тревог и усталости.' },
  { photo: '10.png',  chapter: 'Глава 9',   title: 'Любовь 🫀',
    wish: 'Наша любовь — это не просто слово, это то, как мы смотрим друг на друга, как поддерживаем и чувствуем. С каждым днем это чувство становится только глубже и сильнее.' },
  { photo: '18.png', chapter: 'Глава 10',    title: 'Друзья 🌈',
    wish: 'Ты потрясающий человек, рядом с которым всегда хотят быть люди. Твоя верность, открытость и умение дружить вызывают у меня искреннее восхищение.' },
  { photo: '11.png', chapter: 'Глава 11',   title: 'Вдохновение 🙈',
    wish: 'Ты — мое главное вдохновение во всём. Смотря на тебя, на твои успехи и горящие глаза, мне хочется развиваться, сворачивать горы и делать невозможное.' },
  { photo: '12.png', chapter: 'Глава 12',  title: 'Успех 🎊 ',
    wish: 'Я верю в тебя безоговорочно. У тебя впереди еще столько побед и вершин, и я безумно горжусь каждым твоим шагом, каждым большим и маленьким достижением.' },
  { photo: '9.png', chapter: 'Глава 13', title: 'Путешествия 🗺️ ',
    wish: 'Мечтаю объездить с тобой всю планету. Встречать рассветы в новых городах, открывать неизведанные места и собирать нашу общую коллекцию ярких воспоминаний.' },
  { photo: '13.png', chapter: 'Глава 14',  title: 'Семья 👨‍👨‍👦‍👦',
    wish: 'Пусть дом будет тем местом, куда хочется возвращаться, где пахнет уютом и где тебя всегда ждут с любовью.' },
  { photo: '15.png', chapter: 'Глава 15',   title: 'Волшебство ✨',
    wish: 'Ты умеешь делать так, чтобы в обычной жизни происходило настоящее волшебство. Рядом с тобой будни наполняются сказкой, а обычные вечера становятся особенными.' },
  { photo: '16.png', chapter: 'Финал',      title: 'С любовью ❤️',
    wish: 'Спасибо, что ты есть в моей жизни. С днём рождения, любимая! Пусть этот год станет лучшим в твоей жизни — полным любви, приключений и смеха. Я всегда рядом, пусть этот сайт будет лишь маленькой частью того, что я чувствую к тебе. С твоим днем, любимая! Ты — лучшее, что есть у меня, и я хочу всегда видеть тебя счастливой.' },
  // 17-я страница (Эпилог с видео)
  { photo: '16.png', chapter: 'Эпилог',     title: 'Тебе сюрприз 🎬', hasVideo: true,
    wish: 'И напоследок... Я подготовил для тебя кое-что особенное. Смотри скорее!' },
];

// --- Генерация страниц ---
const book = document.getElementById('book');
pagesData.forEach((data, i) => {
  const p = document.createElement('div');
  p.className = 'page';
  p.dataset.index = i;
  
  let mediaHTML = `<img src="${data.photo}" alt="${data.title}" loading="eager">`;
  if (data.hasVideo) {
    // Добавляем ID, чтобы можно было управлять видео из JS
    mediaHTML = `<video id="epilogueVideo" src="1.MOV" autoplay muted loop playsinline></video>`;
  }

  p.innerHTML = `
    <div class="page-face page-front">
      <div class="photo-side">
        <div class="photo-frame ${data.hasVideo ? 'video-frame' : ''}">
          ${mediaHTML}
        </div>
      </div>
      <div class="text-side">
        <div class="page-num">${data.chapter}</div>
        <h2 class="page-title">${data.title}</h2>
        <p class="page-wish">${data.wish}</p>
      </div>
    </div>
    <div class="page-face page-back"></div>
  `;
  book.appendChild(p);
});

const pages = Array.from(document.querySelectorAll('.page'));
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progress = document.getElementById('progress');
const cover = document.getElementById('cover');
const musicBtn = document.getElementById('musicBtn');
const music = document.getElementById('bgMusic');

// Находим видео
const epilogueVideo = document.getElementById('epilogueVideo');

let current = 0;
let isFlipping = false;
let isPlaying = false;

pages.forEach((p, i) => { p.style.zIndex = pages.length - i; });

pages.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => goTo(i));
  progress.appendChild(d);
});
const dots = Array.from(document.querySelectorAll('.dot'));

function updateUI() {
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
  
  // Принудительный автозапуск видео при открытии последней страницы
  if (current === pages.length - 1 && epilogueVideo) {
    epilogueVideo.play().catch(e => console.log("Автоплей видео заблокирован:", e));
  }
}

function flipForward(target) {
  if (current >= target) { isFlipping = false; return; }
  isFlipping = true;
  const flip = pages[current];
  flip.style.zIndex = 999;
  void flip.offsetWidth;
  flip.style.transform = 'translateZ(0) rotateY(-180deg)';
  let handled = false;
  const done = () => {
    if (handled) return;
    handled = true;
    flip.classList.remove('active');
    flip.style.zIndex = 0;
    current++;
    pages[current].classList.add('active');
    updateUI();
    if (current < target) flipForward(target);
    else isFlipping = false;
  };
  flip.addEventListener('transitionend', function h(e) {
    if (e.propertyName !== 'transform') return;
    flip.removeEventListener('transitionend', h);
    done();
  });
  setTimeout(done, 1250);
}

function flipBackward(target) {
  if (current <= target) { isFlipping = false; return; }
  isFlipping = true;
  const flip = pages[current - 1];
  flip.style.zIndex = 999;
  void flip.offsetWidth;
  flip.style.transform = 'translateZ(0) rotateY(0deg)';
  pages[current].classList.remove('active');
  let handled = false;
  const done = () => {
    if (handled) return;
    handled = true;
    flip.classList.remove('active');
    flip.style.zIndex = pages.length - (current - 1);
    current--;
    pages[current].classList.add('active');
    updateUI();
    if (current > target) flipBackward(target);
    else isFlipping = false;
  };
  flip.addEventListener('transitionend', function h(e) {
    if (e.propertyName !== 'transform') return;
    flip.removeEventListener('transitionend', h);
    done();
  });
  setTimeout(done, 1250);
}

function jumpInstant(target) {
  isFlipping = true;
  pages.forEach((p, i) => {
    p.style.transition = 'none';
    p.classList.remove('active');
    if (i < target) {
      p.style.transform = 'translateZ(0) rotateY(-180deg)';
      p.style.zIndex = 0;
    } else {
      p.style.transform = 'translateZ(0) rotateY(0deg)';
      p.style.zIndex = pages.length - i;
    }
  });
  current = target;
  pages[current].classList.add('active');
  updateUI();
  setTimeout(() => {
    pages.forEach(p => p.style.transition = '');
    isFlipping = false;
  }, 100);
}

function goTo(target) {
  if (isFlipping || target === current) return;
  if (target < 0 || target >= pages.length) return;
  const distance = Math.abs(target - current);
  if (distance > 3) jumpInstant(target);
  else if (target > current) flipForward(target);
  else flipBackward(target);
}

nextBtn.addEventListener('click', () => goTo(current + 1));
prevBtn.addEventListener('click', () => goTo(current - 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft')  goTo(current - 1);
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 55) goTo(current + (diff > 0 ? 1 : -1));
}, { passive: true });

const bg = document.getElementById('bgHearts');
const emojis = ['💕','💖','🌸','✨','💗'];
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'bg-heart';
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  h.style.left = Math.random() * 100 + '%';
  h.style.fontSize = (Math.random() * 20 + 14) + 'px';
  h.style.animationDuration = (Math.random() * 9 + 9) + 's';
  bg.appendChild(h);
  setTimeout(() => h.remove(), 18000);
}, 700);

/* ============================================================
   🎵 ОБЛОЖКА И МУЗЫКА
   ============================================================ */
function toggleMusic() {
  if (isPlaying) {
    music.pause();
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '🎵';
  } else {
    music.play().catch(e => console.log("Ошибка аудио:", e));
    musicBtn.classList.add('playing');
    musicBtn.textContent = '🎶';
  }
  isPlaying = !isPlaying;
}
musicBtn.addEventListener('click', toggleMusic);

cover.addEventListener('click', () => {
  cover.classList.add('hidden');
  if (music.paused) {
    music.play().then(() => {
      isPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    }).catch(e => console.log("Автоплей заблокирован:", e));
  }
  setTimeout(() => { musicBtn.classList.add('show'); }, 1000);
  setTimeout(() => { pages[0].classList.add('active'); }, 600);
});

updateUI();
</script>
</body>
</html>
