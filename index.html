<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8bbd0">
<title>С Днём Рождения 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Playfair Display', Georgia, serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
  }

  /* Фон: плывущие сердечки */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bg-heart {
    position: absolute; font-size: 22px; opacity: 0.4;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    from { transform: translateY(100vh) rotate(0); opacity: 0; }
    10%, 90% { opacity: 0.5; }
    to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }

  /* Книга */
.book-wrapper {
  /* было justify-content: flex-end; */
  justify-content: center; 
}
.book {
  /* было margin-right: 5vw; */
  margin-right: 0; 
}
/* А кнопку "назад" нужно будет сдвинуть */
.nav-prev {
  left: calc(50% - min(350px, 22.5vw) - 28px); /* примерно так */
}

  /* Страница */
  .page {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
    will-change: transform;
  }
  .page-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
    border-radius: 0 22px 22px 0;
    box-shadow: 0 20px 60px rgba(180, 80, 120, 0.28);
  }
  .page-front {
    background:
      radial-gradient(circle at 100% 0%, rgba(255,220,230,0.6) 0%, transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(255,200,220,0.4) 0%, transparent 55%),
      linear-gradient(135deg, #fff9fb 0%, #fff5f8 100%);
    display: flex; padding: 32px; gap: 26px;
  }
  .page-back {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
    display: flex; justify-content: center; align-items: center;
  }
  .page-back::after { content: '💗'; font-size: 64px; opacity: 0.55; }

  /* Фото */
  .photo-side {
    flex: 0 0 42%;
    display: flex; justify-content: center; align-items: center;
  }
  .photo-frame {
    position: relative;
    width: 100%; max-width: 280px;
    aspect-ratio: 3 / 4;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
    padding: 10px;
    box-shadow: 0 10px 30px rgba(180, 80, 120, 0.28);
    border-radius: 4px;
    opacity: 0;
    transform: rotate(-2deg) translateY(20px) scale(0.92);
    transition: opacity 0.9s 0.3s ease, transform 0.9s 0.3s ease;
  }
  .photo-frame img {
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 2px; display: block;
  }
  .page.active .photo-frame {
    opacity: 1;
    transform: rotate(-2deg) translateY(0) scale(1);
  }

  /* Текст */
  .text-side {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 6px;
  }
  .page-num {
    font-family: 'Great Vibes', cursive;
    color: #d68aa8; font-size: 1.2em; margin-bottom: 6px;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.8s 0.35s ease, transform 0.8s 0.35s ease;
  }
  .page-title {
    font-family: 'Great Vibes', cursive;
    color: #c94b6b;
    font-size: clamp(1.7em, 3vw, 2.4em);
    line-height: 1.15; margin-bottom: 16px;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.8s 0.5s ease, transform 0.8s 0.5s ease;
  }
  .page-wish {
    font-size: clamp(0.92em, 1.25vw, 1.04em);
    line-height: 1.8; color: #5a3a42; font-style: italic;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.8s 0.65s ease, transform 0.8s 0.65s ease;
  }
  .page.active .page-num,
  .page.active .page-title,
  .page.active .page-wish {
    opacity: 1; transform: translateY(0);
  }

  /* Кнопки навигации */
  .nav-btn {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,0.92);
    color: #c94b6b; font-size: 26px; font-family: Georgia, serif;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 6px 22px rgba(180, 80, 120, 0.32);
    transition: all 0.25s; z-index: 1000;
  }
  .nav-btn:hover:not(:disabled) {
    background: #c94b6b; color: #fff;
    transform: translateY(-50%) scale(1.1);
  }
  .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }
  .nav-prev { left: calc(5vw + min(700px, 45vw) - 82px); }
  .nav-next { right: 24px; }

  /* Прогресс-точки */
  .progress {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 1000;
    max-width: 90vw; flex-wrap: wrap; justify-content: center;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(201, 75, 107, 0.32);
    cursor: pointer; transition: all 0.3s;
  }
  .dot.active { background: #c94b6b; transform: scale(1.4); }

  /* Подсказка */
  .hint {
    position: fixed; bottom: 22px; right: 22px;
    font-size: 0.85em; color: #d68aa8; font-style: italic;
    animation: hintPulse 2.2s infinite;
    pointer-events: none; z-index: 1000;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  /* Мобильная версия */
  @media (max-width: 800px) {
    .book-wrapper { justify-content: center; perspective: 1600px; }
    .book { width: 92vw; height: 82vh; margin-right: 0; }
    .page-front {
      flex-direction: column; padding: 20px;
      gap: 12px; align-items: center;
    }
    .photo-side { flex: 0 0 auto; }
    .photo-frame { max-width: 150px; aspect-ratio: 1; padding: 8px; }
    .text-side { padding-right: 0; text-align: center; }
    .page-title { font-size: 1.8em; margin-bottom: 10px; }
    .page-wish { font-size: 0.85em; line-height: 1.7; }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }
    .nav-btn { width: 44px; height: 44px; font-size: 20px; }
    .hint { display: none; }
    .dot { width: 8px; height: 8px; }
    .progress { bottom: 14px; gap: 6px; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<div class="book-wrapper">
  <div class="book" id="book"></div>
  <button class="nav-btn nav-prev" id="prevBtn" aria-label="Назад">‹</button>
  <button class="nav-btn nav-next" id="nextBtn" aria-label="Вперёд">›</button>
</div>

<div class="progress" id="progress"></div>
<div class="hint">листай книгу →</div>

<script>
/* ============================================================
   ✏️  ЗДЕСЬ МЕНЯЕШЬ ТЕКСТЫ И ФОТО
   ============================================================ */
const pagesData = [
  { photo: '1.png',  chapter: 'Глава I',    title: 'С Днём Рождения!',
    wish: 'Милая моя, этот день особенный — ведь именно сегодня мир стал чуточку светлее, потому что появилась ты. Пусть эта книга станет маленьким путешествием по всему, что я хочу тебе пожелать.' },

  { photo: '2.png',  chapter: 'Глава II',   title: 'Твоя улыбка',
    wish: 'Твоя улыбка — моё самое любимое зрелище на свете. Пусть в новом году будет как можно больше поводов для неё, а каждый рассвет приносит радость.' },

  { photo: '3.png',  chapter: 'Глава III',  title: 'Твои глаза',
    wish: 'В твоих глазах можно утонуть — такие они глубокие и тёплые. Желаю тебе видеть вокруг только хорошее, а в отражении — людей, которые тебя искренне любят.' },

  { photo: '4.png',  chapter: 'Глава IV',   title: 'Твоя доброта',
    wish: 'Ты умеешь согревать одним словом, одной улыбкой. Пусть твоя доброта возвращается к тебе сторицей, а мир будет к тебе так же нежен, как ты к нему.' },

  { photo: '5.png',  chapter: 'Глава V',    title: 'Твой смех',
    wish: 'Твой смех — лучше любой музыки. Пусть в твоей жизни будет столько поводов смеяться, что скучать просто не останется времени.' },

  { photo: '6.png',  chapter: 'Глава VI',   title: 'Мечты',
    wish: 'Загадай самое заветное желание — и оно обязательно сбудется. Ты заслуживаешь всего самого лучшего, что есть в этом мире. Пусть мечты превращаются в планы, а планы — в счастливые воспоминания.' },

  { photo: '7.png',  chapter: 'Глава VII',  title: 'Приключения',
    wish: 'Пусть этот год будет полон спонтанных поездок, новых мест и незабываемых моментов. И пусть рядом всегда будет кто-то, с кем не страшно свернуть с маршрута.' },

  { photo: '8.png',  chapter: 'Глава VIII', title: 'Здоровье',
    wish: 'Желаю тебе крепкого здоровья и энергии на всё, что ты задумала. Пусть тело будет лёгким, сон — сладким, а утро — добрым.' },

  { photo: '9.png',  chapter: 'Глава IX',   title: 'Любовь',
    wish: 'Желаю тебе любви — большой, настоящей, такой, от которой захватывает дух. И пусть она будет взаимной, нежной и каждый день — как в первый раз.' },

  { photo: '10.png', chapter: 'Глава X',    title: 'Друзья',
    wish: 'Пусть рядом всегда будут люди, которые тебя понимают без слов, поддерживают без условий и радуются твоим успехам, как своим собственным.' },

  { photo: '11.png', chapter: 'Глава XI',   title: 'Вдохновение',
    wish: 'Желаю тебе гореть любимым делом, находить красоту в мелочах и создавать то, что хочется показать миру. Твори, мечтай, живи на полную.' },

  { photo: '12.png', chapter: 'Глава XII',  title: 'Успех',
    wish: 'Пусть все твои начинания увенчаются успехом, а усилия — достойной наградой. Ты способна на большее, чем сама думаешь.' },

  { photo: '13.png', chapter: 'Глава XIII', title: 'Путешествия',
    wish: 'Пусть горизонты зовут, а билеты находятся сами собой. Впереди столько неизведанного — и всё это теперь твоё.' },

  { photo: '14.png', chapter: 'Глава XIV',  title: 'Семья',
    wish: 'Пусть дом будет тем местом, куда хочется возвращаться, где пахнет уютом и где тебя всегда ждут с любовью.' },

  { photo: '15.png', chapter: 'Глава XV',   title: 'Волшебство',
    wish: 'В жизни всегда есть место чуду — особенно для тех, кто в него верит. Пусть каждый день приносит маленькое волшебство и большие сюрпризы.' },

  { photo: '16.png', chapter: 'Финал',      title: 'С любовью 💝',
    wish: 'Спасибо, что ты есть в моей жизни. С днём рождения, любимая! Пусть этот год станет лучшим в твоей жизни — полным любви, приключений и смеха. Я всегда рядом. ❤️' },
];
/* ============================================================ */

// Генерируем страницы
const book = document.getElementById('book');
pagesData.forEach((data, i) => {
  const p = document.createElement('div');
  p.className = 'page';
  p.dataset.index = i;
  p.innerHTML = `
    <div class="page-face page-front">
      <div class="photo-side">
        <div class="photo-frame">
          <img src="${data.photo}" alt="${data.title}" loading="eager">
        </div>
      </div>
      <div class="text-side">
        <div class="page-num">${data.chapter}</div>
        <h2 class="page-title">${data.title}</h2>
        <p class="page-wish">${data.wish}</p>
      </div>
    </div>
    <div class="page-face page-back"></div>
  `;
  book.appendChild(p);
});

const pages = Array.from(document.querySelectorAll('.page'));
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progress = document.getElementById('progress');

let current = 0;
let isFlipping = false;

// Начальные z-index (страница 0 сверху)
pages.forEach((p, i) => { p.style.zIndex = pages.length - i; });

// Точки
pages.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => goTo(i));
  progress.appendChild(d);
});
const dots = Array.from(document.querySelectorAll('.dot'));

function updateUI() {
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
}

/* ---------- Листание вперёд ---------- */
function flipForward(target) {
  if (current >= target) { isFlipping = false; return; }
  isFlipping = true;

  const flipIndex = current;
  const flip = pages[flipIndex];
  flip.style.zIndex = 999;
  void flip.offsetWidth;
  flip.style.transform = 'rotateY(-180deg)';

  let handled = false;
  const done = () => {
    if (handled) return;
    handled = true;
    flip.classList.remove('active');
    flip.style.zIndex = 0;
    current = flipIndex + 1;
    pages[current].classList.add('active');
    updateUI();
    if (current < target) flipForward(target);
    else isFlipping = false;
  };
  flip.addEventListener('transitionend', function h(e) {
    if (e.propertyName !== 'transform') return;
    flip.removeEventListener('transitionend', h);
    done();
  });
  setTimeout(done, 1250);
}

/* ---------- Листание назад ---------- */
function flipBackward(target) {
  if (current <= target) { isFlipping = false; return; }
  isFlipping = true;

  const flipIndex = current - 1;
  const flip = pages[flipIndex];
  flip.style.zIndex = 999;
  void flip.offsetWidth;
  flip.style.transform = 'rotateY(0deg)';
  pages[current].classList.remove('active');

  let handled = false;
  const done = () => {
    if (handled) return;
    handled = true;
    flip.classList.remove('active');
    flip.style.zIndex = pages.length - flipIndex;
    current = flipIndex;
    pages[current].classList.add('active');
    updateUI();
    if (current > target) flipBackward(target);
    else isFlipping = false;
  };
  flip.addEventListener('transitionend', function h(e) {
    if (e.propertyName !== 'transform') return;
    flip.removeEventListener('transitionend', h);
    done();
  });
  setTimeout(done, 1250);
}

/* ---------- Прыжок без анимации (для больших дистанций) ---------- */
function jumpInstant(target) {
  isFlipping = true;
  pages.forEach((p, i) => {
    p.style.transition = 'none';
    p.classList.remove('active');
    if (i < target) {
      p.style.transform = 'rotateY(-180deg)';
      p.style.zIndex = 0;
    } else {
      p.style.transform = 'rotateY(0deg)';
      p.style.zIndex = pages.length - i;
    }
  });
  current = target;
  pages[current].classList.add('active');
  updateUI();
  setTimeout(() => {
    pages.forEach(p => p.style.transition = '');
    isFlipping = false;
  }, 100);
}

/* ---------- Публичный переход ---------- */
function goTo(target) {
  if (isFlipping || target === current) return;
  if (target < 0 || target >= pages.length) return;
  const distance = Math.abs(target - current);
  if (distance > 3) jumpInstant(target);
  else if (target > current) flipForward(target);
  else flipBackward(target);
}

nextBtn.addEventListener('click', () => goTo(current + 1));
prevBtn.addEventListener('click', () => goTo(current - 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft')  goTo(current - 1);
});

// Свайпы на мобильных
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
document.addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 55) goTo(current + (diff > 0 ? 1 : -1));
}, { passive: true });

/* ---------- Фоновые сердечки ---------- */
const bg = document.getElementById('bgHearts');
const emojis = ['💕','💖','🌸','✨','💗'];
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'bg-heart';
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  h.style.left = Math.random() * 100 + '%';
  h.style.fontSize = (Math.random() * 20 + 14) + 'px';
  h.style.animationDuration = (Math.random() * 9 + 9) + 's';
  bg.appendChild(h);
  setTimeout(() => h.remove(), 18000);
}, 700);

/* ---------- Старт ---------- */
updateUI();
setTimeout(() => pages[0].classList.add('active'), 400);
</script>
</body>
</html>
